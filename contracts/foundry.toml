# Aevum RPC（cdk-erigon）接受 PUSH0，但拒绝 MCOPY / TSTORE。
# 所以锁死 shanghai，不能用 Foundry 默认的 cancun。
# 类似 Java 里把 maven-compiler 的 release 钉死，避免 CI 和本机各编各的。

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[rpc_endpoints]
aevum_testnet = "https://rpc-test.qday.info"
localhost = "http://127.0.0.1:8545"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
number_underscore = "thousands"
