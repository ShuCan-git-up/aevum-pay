name: ci

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install libraries
        run: bash scripts/bootstrap-contracts.sh
      - name: solc is shanghai
        working-directory: contracts
        run: forge config --json | python3 -c 'import json,sys; c=json.load(sys.stdin); assert c["evm_version"]=="shanghai" and c["solc"]=="0.8.24"'
      - name: forge test
        working-directory: contracts
        run: forge test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install Maven
        run: |
          if ! command -v mvn >/dev/null; then
            curl -fsSL -o /tmp/maven.tgz https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz
            tar -xzf /tmp/maven.tgz -C /tmp
            echo "/tmp/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          fi
      - name: Backend tests
        run: mvn -B test -f backend/pom.xml

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install Maven
        run: |
          if ! command -v mvn >/dev/null; then
            curl -fsSL -o /tmp/maven.tgz https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz
            tar -xzf /tmp/maven.tgz -C /tmp
            echo "/tmp/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          fi
      - name: Anvil end to end
        run: bash scripts/e2e.sh
